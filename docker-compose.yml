services:
  db:
    image: postgres:16-alpine
    container_name: evoting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evoting
      POSTGRES_PASSWORD: evoting
      POSTGRES_DB: evoting
    ports:
      - "5432:5432"
    volumes:
      - evoting_pgdata:/var/lib/postgresql/data

volumes:
  evoting_pgdata:
